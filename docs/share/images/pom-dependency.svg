<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" text-rendering="geometricPrecision">
  <style>
    .bg{fill:#fafbfc}
    .title{font:600 20px ui-sans-serif,system-ui,sans-serif;fill:#1f2328}
    .sub{font:13px ui-sans-serif,system-ui,sans-serif;fill:#656d76}
    .pF{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .pB{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .pT{font:600 15px ui-sans-serif,system-ui,sans-serif;fill:#0969da}
    .pTb{font:600 15px ui-sans-serif,system-ui,sans-serif;fill:#1a7f37}
    .node{fill:#ffffff;stroke:#8c959f;stroke-width:1}
    .core{fill:#0969da;stroke:#0969da}
    .lbl{font:13px ui-sans-serif,system-ui,sans-serif;fill:#1f2328}
    .lblW{font:600 14px ui-sans-serif,system-ui,sans-serif;fill:#ffffff}
    .arr{stroke:#6e7781;stroke-width:1.5;fill:none}
    .arrBig{stroke:#1f2328;stroke-width:2.5;fill:none}
    .note{font:12px ui-sans-serif,system-ui,sans-serif;fill:#656d76}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
  </defs>
  <rect class="bg" width="940" height="540"/>
  <text x="32" y="42" class="title">pom 依赖方向</text>
  <text x="32" y="64" class="sub">单向依赖：business → foundation，永不反向</text>

  <!-- foundation panel -->
  <rect class="pF" x="40" y="90" width="860" height="160" rx="10"/>
  <text x="60" y="116" class="pT">foundation 基础组件</text>
  <rect class="core" x="400" y="150" width="140" height="42" rx="6"/>
  <text x="470" y="177" text-anchor="middle" class="lblW">core（零依赖内核）</text>

  <rect class="node" x="80" y="118" width="120" height="32" rx="6"/><text x="140" y="139" text-anchor="middle" class="lbl">web</text>
  <rect class="node" x="80" y="158" width="120" height="32" rx="6"/><text x="140" y="179" text-anchor="middle" class="lbl">mybatis</text>
  <rect class="node" x="80" y="198" width="120" height="32" rx="6"/><text x="140" y="219" text-anchor="middle" class="lbl">domain</text>

  <rect class="node" x="740" y="118" width="120" height="32" rx="6"/><text x="800" y="139" text-anchor="middle" class="lbl">extension</text>
  <text x="800" y="240" text-anchor="middle" class="note">lock · message · notify 为独立模块，按需引入</text>

  <line class="arr" x1="200" y1="134" x2="395" y2="165" marker-end="url(#a)"/>
  <line class="arr" x1="200" y1="174" x2="395" y2="172" marker-end="url(#a)"/>
  <line class="arr" x1="200" y1="214" x2="395" y2="180" marker-end="url(#a)"/>
  <line class="arr" x1="735" y1="134" x2="545" y2="165" marker-end="url(#a)"/>

  <!-- big arrow -->
  <line class="arrBig" x1="470" y1="300" x2="470" y2="256" marker-end="url(#ab)"/>
  <text x="486" y="284" class="note">依赖</text>

  <!-- business panel -->
  <rect class="pB" x="40" y="300" width="860" height="210" rx="10"/>
  <text x="60" y="326" class="pTb">business 业务流程（DDD 五层）</text>

  <rect class="node" x="350" y="338" width="220" height="30" rx="6"/><text x="460" y="358" text-anchor="middle" class="lbl">facade</text>
  <rect class="node" x="350" y="372" width="220" height="30" rx="6"/><text x="460" y="392" text-anchor="middle" class="lbl">domain</text>
  <rect class="node" x="350" y="406" width="220" height="30" rx="6"/><text x="460" y="426" text-anchor="middle" class="lbl">infrastructure</text>
  <rect class="node" x="350" y="440" width="220" height="30" rx="6"/><text x="460" y="460" text-anchor="middle" class="lbl">application</text>
  <rect class="node" x="350" y="474" width="220" height="30" rx="6"/><text x="460" y="494" text-anchor="middle" class="lbl">web</text>

  <text x="590" y="358" class="note">对外契约</text>
  <text x="590" y="392" class="note">领域核心（零外部依赖）</text>
  <text x="590" y="426" class="note">实现 domain 仓储端口</text>
  <text x="590" y="460" class="note">编排 · 事务边界</text>
  <text x="590" y="494" class="note">启动 · 接入</text>

  <line class="arr" x1="320" y1="345" x2="320" y2="497" marker-end="url(#a)"/>
  <text x="250" y="425" class="note">依赖方向 ↓</text>
</svg>
