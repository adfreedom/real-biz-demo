<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" text-rendering="geometricPrecision">
  <style>
    .bg{fill:#fafbfc}
    .title{font:600 20px ui-sans-serif,system-ui,sans-serif;fill:#1f2328}
    .sub{font:13px ui-sans-serif,system-ui,sans-serif;fill:#656d76}
    .biz{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .asp{fill:#fff8c5;stroke:#bf8700;stroke-width:1.5}
    .ext{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .h{font:600 14px ui-sans-serif,system-ui,sans-serif;fill:#1f2328}
    .hW{font:600 14px ui-sans-serif,system-ui,sans-serif;fill:#ffffff}
    .t{font:12.5px ui-sans-serif,system-ui,sans-serif;fill:#1f2328}
    .m{font:12px ui-monospace,Consolas,Menlo,monospace;fill:#1f2328}
    .note{font:12px ui-sans-serif,system-ui,sans-serif;fill:#656d76}
    .arr{stroke:#6e7781;stroke-width:1.6;fill:none}
    .no{stroke:#cf222e;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <rect class="bg" width="940" height="460"/>
  <text x="32" y="42" class="title">分布式锁的执行链路</text>
  <text x="32" y="64" class="sub">@ConcurrencyFilter · AOP 兜底加解锁 · 异常归一</text>

  <!-- business method -->
  <rect class="biz" x="40" y="100" width="240" height="90" rx="8"/>
  <text x="160" y="126" text-anchor="middle" class="h">应用服务方法</text>
  <text x="160" y="150" text-anchor="middle" class="m">@ConcurrencyFilter</text>
  <text x="160" y="170" text-anchor="middle" class="t">placeOrder(request)</text>

  <!-- AOP -->
  <rect class="asp" x="340" y="90" width="280" height="110" rx="8"/>
  <rect x="340" y="90" width="280" height="28" rx="8" fill="#bf8700"/>
  <text x="480" y="110" text-anchor="middle" class="hW">ConcurrentInterceptor（切面）</text>
  <text x="356" y="138" class="m">@Around @ConcurrencyFilter</text>
  <text x="356" y="158" class="t">① 取锁 key：参数 instanceof ConcurrentKey</text>
  <text x="356" y="176" class="t">　 → getConcurrentKey() / 类名+hashCode</text>
  <text x="356" y="194" class="t">② prefix = spring.application.name</text>

  <!-- redisson -->
  <rect class="ext" x="700" y="100" width="200" height="90" rx="8"/>
  <text x="800" y="126" text-anchor="middle" class="h">RedissonClient</text>
  <text x="800" y="148" text-anchor="middle" class="t">tryLock(waitTime, ms)</text>
  <text x="800" y="168" text-anchor="middle" class="t">leaseTime=-1 看门狗续期</text>
  <text x="800" y="186" text-anchor="middle" class="t">finally unlock()</text>

  <line class="arr" x1="280" y1="145" x2="336" y2="145" marker-end="url(#a)"/>
  <line class="arr" x1="620" y1="145" x2="696" y2="145" marker-end="url(#a)"/>

  <!-- proceed / exception -->
  <rect class="biz" x="120" y="250" width="320" height="60" rx="8"/>
  <text x="280" y="276" text-anchor="middle" class="h">point.proceed() 执行业务</text>
  <text x="280" y="296" text-anchor="middle" class="note">成功 → 返回；finally 释放锁</text>

  <rect class="ext" x="500" y="250" width="320" height="60" rx="8" stroke="#cf222e"/>
  <text x="660" y="276" text-anchor="middle" class="h" fill="#cf222e">超时未拿到锁</text>
  <text x="660" y="296" text-anchor="middle" class="note">throw ConcurrentException（请勿重复操作）</text>

  <line class="arr" x1="800" y1="190" x2="800" y2="220" marker-end="url(#a)"/>
  <text x="816" y="208" class="note">拿到锁</text>
  <line class="arr" x1="800" y1="220" x2="280" y2="220"/>
  <line class="arr" x1="280" y1="220" x2="280" y2="246" marker-end="url(#a)"/>

  <line class="no" x1="660" y1="190" x2="660" y2="246" marker-end="url(#ar)"/>

  <!-- global handler -->
  <rect class="ext" x="500" y="350" width="320" height="60" rx="8"/>
  <text x="660" y="376" text-anchor="middle" class="h">全局异常处理器</text>
  <text x="660" y="396" text-anchor="middle" class="note">ConcurrentException → Result.fail(NOT_REPEAT)</text>
  <line class="no" x1="660" y1="310" x2="660" y2="346" marker-end="url(#ar)"/>

  <text x="32" y="440" class="note">业务方法仅写一行 @ConcurrencyFilter；key 提取、加解锁、续期、异常归一全部内聚在切面 + 全局异常处理器。</text>
</svg>
